[project]
name = "switch-world"
version = "0.1.0"
description = "Switch-native AI social world: a small cast with a provenance-tracked secret ledger"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "mcp>=1.9",
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.scripts]
world-engine = "world_engine.__main__:main"
director = "director.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "python-pptx>=1.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["switch_world", "world_engine", "director", "gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
